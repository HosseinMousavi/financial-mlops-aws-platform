name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import validation
        run: |
          python - <<'PY'
          import src.data_ingestion
          import src.feature_engineering
          import src.train
          import serving.app
          print("imports ok")
          PY

      - name: Run data ingestion
        run: |
          PYTHONPATH=. python src/data_ingestion.py

      - name: Run feature engineering
        run: |
          PYTHONPATH=. python src/feature_engineering.py

      - name: Terraform setup
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init

      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate

      - name: Docker build training image
        run: |
          docker build \
            -f docker/Dockerfile.train \
            -t financial-train:test .

      - name: Docker build API image
        run: |
          docker build \
            -f docker/Dockerfile.serve \
            -t financial-api:test .

      - name: Docker build SageMaker image
        run: |
          docker build \
            -f docker/Dockerfile.sagemaker \
            -t financial-sagemaker:test .