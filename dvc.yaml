stages:
  ingest:
    cmd: python src/data_ingestion.py
    deps:
      - src/data_ingestion.py
    outs:
      - data/raw/BTCUSDT_1m_raw.csv
  features:
    cmd: python src/feature_engineering.py
    deps:
      - src/feature_engineering.py
      - data/raw/BTCUSDT_1m_raw.csv
    outs:
      - data/processed/BTCUSDT_1m_features.csv
  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/processed/BTCUSDT_1m_features.csv
    outs:
      - models/model.joblib
    metrics:
      - reports/metrics.json
  monitor:
    cmd: python monitoring/run_evidently.py
    deps:
      - monitoring/run_evidently.py
      - data/processed/BTCUSDT_1m_features.csv
    outs:
      - reports/evidently_drift_report.html
      - reports/evidently_drift_report.json
